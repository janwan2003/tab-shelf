<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tabhaven</title>
  <style>
    :root { --bg:#fff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb; --primary:#0f766e; --ink:#fff; --hover:#f0fdfa; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg:#1a1d20; --text:#e5e7eb; --muted:#9ca3af; --line:#2b3035; --primary:#2dd4bf; --ink:#042f2e; --hover:#12302d; } }
    body { margin:0; width:270px; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
    header { display:flex; align-items:center; gap:8px; padding:10px 12px; font-weight:700; color:var(--primary); border-bottom:1px solid var(--line); }
    .list { padding:8px; display:flex; flex-direction:column; gap:6px; }
    button { font:inherit; text-align:left; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
    button:hover { background:var(--hover); border-color:var(--primary); }
    button.primary { background:var(--primary); color:var(--ink); border-color:var(--primary); font-weight:600; }
    .n { opacity:.75; font-variant-numeric: tabular-nums; }
    footer { padding:6px 12px 10px; color:var(--muted); font-size:12px; }
    footer.err { color:#b91c1c; }
  </style>
</head>
<body>
  <header><img src="icons/32.png" width="20" height="20" alt="">Tabhaven</header>
  <div class="list">
    <button id="save-window" class="primary">Save this window <span class="n" id="n-window"></span></button>
    <button id="save-all">Save all windows <span class="n" id="n-all"></span></button>
    <button id="save-tab">Save only this tab</button>
    <button id="open">Open shelf <span class="n" id="n-shelf"></span></button>
  </div>
  <footer id="status"></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
